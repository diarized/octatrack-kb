[project]
name = "octatrack-kb"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.49",
    "pymupdf>=1.24",
    "sentence-transformers>=3.0",
    "sqlite-vec>=0.1.6",
    "mcp>=1.2",
    "pyyaml>=6.0",
    "python-frontmatter>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
